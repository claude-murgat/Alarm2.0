name: Android — Release APK

# Publie une GitHub Release avec l'APK signe en piece jointe, pour que
# l'installation se resume a : ouvrir la page Releases, telecharger, installer.
#
# Declencheur : push d'un tag `v*`.
#   git tag v1.0.0 && git push origin v1.0.0
#
# Tourne sur `ubuntu-latest` (runner GitHub) et PAS sur le runner self-hosted
# `alarm-android`. Deux raisons : ce runner etait hors service (cf PR #195 pour
# le meme probleme sur les runners `alarm-ci`), et une release ne doit pas
# dependre d'une machine de bureau allumee.

on:
  push:
    tags:
      - 'v*'

permissions:
  # Necessaire pour creer la Release et y attacher l'APK.
  contents: write

# Deux pushs rapides du meme tag lanceraient deux publications en parallele
# qui se marchent dessus (issue #200). On les serialise, sans annuler celle
# en cours : une release a moitie publiee est pire qu'une release en retard.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build + publication de l'APK signe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout avec historique complet
        uses: actions/checkout@v4
        with:
          # OBLIGATOIRE. INV-ANDROID-109 derive `versionCode` de
          # `git rev-list --count HEAD`. Avec le checkout shallow par defaut
          # (depth=1) le compte vaut 1 : toutes les releases sortiraient en
          # versionCode=1 et Android refuserait chaque mise a jour comme un
          # downgrade (INSTALL_FAILED_VERSION_DOWNGRADE).
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: SDK Android (platform 34 + build-tools 34)
        run: |
          set -eu
          : "${ANDROID_HOME:?ANDROID_HOME non defini sur ce runner}"
          # `sdkmanager` n'est PAS sur le PATH des runners ubuntu-latest (constate :
          # `sdkmanager: command not found`, exit 127). Il vit sous
          # $ANDROID_HOME/cmdline-tools/<version>/bin. On le localise au lieu de le
          # supposer, et on affiche d'abord ce qui est REELLEMENT installe : l'image
          # ubuntu-latest embarque deja des platforms/build-tools, donc le cas normal
          # est de n'avoir rien a installer.
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "platforms   : $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools : $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"

          if [ -d "$ANDROID_HOME/platforms/android-34" ] \
             && ls "$ANDROID_HOME/build-tools" 2>/dev/null | grep -q '^34\.'; then
            echo "platform 34 et build-tools 34 deja presents — rien a installer."
            exit 0
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null \
                       | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::platform 34 ou build-tools 34 manquante, et sdkmanager introuvable sous $ANDROID_HOME/cmdline-tools."
            exit 1
          fi
          echo "sdkmanager : $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: google-services.json (secret — jamais un stub)
        env:
          GS_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          # android/app/google-services.json est gitignore, donc absent du
          # checkout. tier4-failback.yml ecrit un stub parce que ses tests
          # n'utilisent pas FCM — interdit ici : un stub laisse le build passer
          # mais casse silencieusement le push, et c'est le push qui reveille
          # les utilisateurs hors astreinte (statut "En attente"). On refuse de
          # publier plutot que de livrer une app muette.
          if [ -z "${GS_B64:-}" ]; then
            echo "::error::secret ANDROID_GOOGLE_SERVICES_JSON absent — release refusee (un stub casserait le push FCM)."
            exit 1
          fi
          printf '%s' "$GS_B64" | base64 -d > android/app/google-services.json
          # jq plutot qu'un heredoc python : dans un bloc `run: |` le corps du
          # heredoc est indente de 10 espaces, et python refuserait ce bloc
          # (IndentationError) — `<<-` ne retire que les tabulations, qu'un YAML
          # ne peut pas contenir. jq valide le JSON au passage.
          PID=$(jq -er '.project_info.project_id' android/app/google-services.json)
          echo "project_id = $PID"
          case "$PID" in
            *stub*)
              echo "::error::c'est le stub de tier4-failback, pas la vraie config FCM — release refusee."
              exit 1
              ;;
          esac

      - name: Keystore de signature (secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 absent — release refusee."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/alarm-release.jks"
          test -s "$RUNNER_TEMP/alarm-release.jks"

      - name: assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alarm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Verifier que l'APK est bien signe
        id: apk
        run: |
          set -eu
          DIR=android/app/build/outputs/apk/release
          APK="$DIR/app-release.apk"
          # Garde-fou central : sans signingConfig, Gradle nomme sa sortie
          # `app-release-unsigned.apk`. L'absence de `app-release.apk` signifie
          # donc "signature non appliquee" — on echoue au lieu de publier un
          # APK que personne ne peut installer.
          if [ ! -f "$APK" ]; then
            echo "::error::$APK introuvable — l'APK n'a pas ete signe."
            ls -la "$DIR" || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

          # Version recalculee comme le fait build.gradle.kts (INV-ANDROID-109),
          # plutot que lue avec aapt : meme source de verite, pas de dependance
          # a un binaire du SDK dont le nom change selon les build-tools.
          VER="$(git describe --tags --match 'v*' --dirty)"
          VER="${VER#v}"
          OUT="alarme-murgat-${GITHUB_REF_NAME}-${VER}.apk"
          cp "$APK" "$OUT"
          {
            echo "apk=$OUT"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
          VER: ${{ steps.apk.outputs.version }}
        run: |
          set -eu
          CODE=$(git rev-list --count HEAD)
          {
            printf '**APK signe : `%s`** — telecharger, ouvrir sur le telephone, installer.\n\n' "$APK"
            printf '| | |\n|---|---|\n'
            printf '| Version | `%s` |\n' "$VER"
            printf '| Commit | `%s` |\n' "$GITHUB_SHA"
            printf '| versionCode | `%s` |\n\n' "$CODE"
            printf '### Installation\n\n'
            printf '1. Telecharger l APK ci-dessous depuis le telephone.\n'
            printf '2. Autoriser l installation depuis cette source si Android le demande\n'
            printf '   (Parametres > Applications > Acces special > Installer des applications inconnues).\n'
            printf '3. Installer. Une mise a jour s installe par-dessus la precedente sans\n'
            printf '   desinstaller, tant que les releases sont signees avec la meme cle.\n\n'
            printf '### Backends joints par cette version\n\n'
            printf 'Dans l ordre d essai, avec failover circulaire (INV-ANDROID-402) :\n\n'
            printf '1. `51.210.105.102:8000` — noeud cloud OVH, le seul joignable hors du LAN du site\n'
            printf '2. `192.168.1.50:8000` — onsite-1, sur le LAN du site\n'
            printf '3. `192.168.1.51:8000` — onsite-2, sur le LAN du site\n'
          } > release-notes.md
          cat release-notes.md
          # Idempotent : un re-run du workflow sur le meme tag remplace l APK
          # au lieu d echouer sur "release already exists".
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Tag deplace sur un autre commit : le nom de l APK contient le sha,
            # donc --clobber ne remplace pas l ancien. On retire les APK
            # precedents pour qu un seul reste telechargeable.
            # Filtre dans jq et pas grep : un grep sans resultat sort en 1 et
            # ferait echouer le step (bash -eo pipefail).
            gh release view "$GITHUB_REF_NAME" --json assets \
              --jq ".assets[].name | select(endswith(\".apk\") and . != \"$APK\")" \
              | while read -r OLD; do gh release delete-asset "$GITHUB_REF_NAME" "$OLD" --yes; done
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
            # Les notes (version, commit, versionCode) doivent decrire l APK
            # attache, pas celui de la premiere publication (issue #199).
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Alarme Murgat $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release view "$GITHUB_REF_NAME" --json url --jq '"Release publiee : " + .url'

      # APK du cluster de TEST (alarm-1/alarm-2), app separee "Alarme Murgat TEST"
      # (build type clustertest). Firebase exige que com.alarm.critical.test soit declare
      # dans google-services.json : sinon on saute (warning) sans bloquer la release prod.
      - name: APK du cluster de test (Alarme Murgat TEST)
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/alarm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VER: ${{ steps.apk.outputs.version }}
        run: |
          set -eu
          if ! jq -e '.client[].client_info.android_client_info.package_name | select(. == "com.alarm.critical.test")' \
               android/app/google-services.json > /dev/null; then
            echo "::warning::com.alarm.critical.test absent de google-services.json — APK de test non publie."
            exit 0
          fi
          (cd android && ./gradlew assembleClustertest --no-daemon --console=plain)
          APK=android/app/build/outputs/apk/clustertest/app-clustertest.apk
          test -f "$APK" || { echo "::error::$APK introuvable — APK de test non signe."; exit 1; }
          OUT="alarme-murgat-TEST-${GITHUB_REF_NAME}-${VER}.apk"
          cp "$APK" "$OUT"
          gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber

      - name: Conserver l'APK en artefact (debug du workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
