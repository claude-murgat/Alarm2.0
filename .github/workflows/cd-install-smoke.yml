# CD Install Smoke — verifie que les units systemd CD s'installent proprement
# et que le 1er run ne casse pas sur des problemes triviaux (perms, fichiers
# manquants, syntaxe systemd, sudoers).
#
# Couvre :
#   - alarm-cd-pull.{service,timer,sh}            : sur les 3 noeuds (V1 PR 3)
#   - alarm-cd-orchestrate.{service,timer,sh}     : sur NODE3 uniquement (V1.5 PR 9)
#   - infra/onsite/sudoers/alarm-cd               : NOPASSWD chirurgical
#
# Pourquoi ce workflow existe :
#   La PR initiale de fix `fix/cd-pull-lock-runtime-dir` corrige un bug ou le
#   script essayait d'ecrire /run/alarm-cd-pull.lock alors qu'il tourne en
#   User=alarm (donc pas root, donc pas le droit d'ecrire dans /run/). Le bug
#   etait passe les 8 PRs CD V1 parce qu'aucun test n'exerce l'install reelle.
#   Ce workflow comble ce trou pour tous les units CD (pull + orchestrate).
#
# Ne pas confondre avec :
#   - cd-build.yml : build et push des images Docker sur GHCR (PR 1).
#   - cd-promote-stable.yml : promotion sha-XXX -> :stable (PR 7).
#
# Scope : on teste que les services demarrent, vont au-dela de la creation du
# lock, et que la regression "Permission denied" n'apparait pas. On NE teste
# PAS le pull GHCR effectif (auth registry pas configuree pour le runner, et
# de toute facon hors-scope d'un smoke d'install). Pareil pour orchestrate :
# pas de SSH reel vers des noeuds (le runner n'a pas le mesh WG).

name: CD Install Smoke

on:
  pull_request:
    paths:
      - 'scripts/alarm-cd-pull.sh'
      - 'scripts/alarm-cd-orchestrate.sh'
      - 'infra/onsite/systemd/alarm-cd-pull.*'
      - 'infra/onsite/systemd/alarm-cd-orchestrate.*'
      - 'scripts/alarm-chaos.sh'
      - 'infra/onsite/systemd/alarm-chaos.*'
      - 'infra/onsite/sudoers/alarm-cd'
      - 'scripts/alarm-gateway-sync.sh'
      - 'infra/onsite/systemd/alarm-gateway-sync.*'
      - 'gateway/**'
      - '.github/workflows/cd-install-smoke.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/alarm-cd-pull.sh'
      - 'scripts/alarm-cd-orchestrate.sh'
      - 'infra/onsite/systemd/alarm-cd-pull.*'
      - 'infra/onsite/systemd/alarm-cd-orchestrate.*'
      - 'scripts/alarm-chaos.sh'
      - 'infra/onsite/systemd/alarm-chaos.*'
      - 'infra/onsite/sudoers/alarm-cd'
      - 'scripts/alarm-gateway-sync.sh'
      - 'infra/onsite/systemd/alarm-gateway-sync.*'
      - 'gateway/**'
      - '.github/workflows/cd-install-smoke.yml'

jobs:
  smoke-install:
    name: alarm-cd-pull install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup user alarm (simulant un noeud prod)
        # Cf docs/PROVISIONING_ONSITE.md §3.3 : user 'alarm' avec groupe docker.
        run: |
          sudo useradd -r -m -s /bin/bash alarm
          sudo usermod -aG docker alarm

      - name: Install script + units systemd (procedure du brief Phase 3)
        run: |
          sudo install -m 755 scripts/alarm-cd-pull.sh /usr/local/bin/alarm-cd-pull
          sudo install -m 644 infra/onsite/systemd/alarm-cd-pull.service /etc/systemd/system/
          sudo install -m 644 infra/onsite/systemd/alarm-cd-pull.timer /etc/systemd/system/
          sudo systemctl daemon-reload

      - name: Lint syntaxe unit systemd
        # systemd-analyze verify : refuse les directives inconnues, typos, etc.
        run: sudo systemd-analyze verify /etc/systemd/system/alarm-cd-pull.service /etc/systemd/system/alarm-cd-pull.timer

      - name: Lint syntaxe sudoers infra/onsite/sudoers/alarm-cd
        # `visudo -c -f` parse strict, refuse les typos sur Cmnd_Alias, alias inconnus,
        # virgules manquantes, etc. Sans ce test, une sudoers cassee deployee en prod
        # empeche TOUTES les commandes sudo de tourner (incl. l'humain qui doit reparer
        # depuis sa 2e session SSH ouverte en filet de securite).
        run: sudo visudo -c -f infra/onsite/sudoers/alarm-cd

      - name: Lancer le service (Type=oneshot blocking)
        # Tolere un exit non-0 cote downstream (registry GHCR pas auth dans CI,
        # le script journalise un WARN par image et exit 0 normalement). Ce
        # qu'on teste ici : le service VA jusqu'au bout sans crasher avant.
        run: |
          sudo systemctl start alarm-cd-pull.service || true
          sudo systemctl status alarm-cd-pull.service --no-pager --lines=20 || true

      - name: Regression guard — pas de "Permission denied" dans le journal
        # Le bug d'origine : "/usr/local/bin/alarm-cd-pull: line 35:
        # /run/alarm-cd-pull.lock: Permission denied". Si on retrouve ce
        # pattern, c'est qu'on a regresse.
        run: |
          sudo journalctl -u alarm-cd-pull.service --no-pager > /tmp/journal.txt
          cat /tmp/journal.txt
          if grep -qi "permission denied" /tmp/journal.txt; then
            echo "::error::Regression: 'Permission denied' detecte dans le journal alarm-cd-pull"
            exit 1
          fi

      - name: Verif RuntimeDirectory + StateDirectory presents dans l'unit
        # RuntimeDirectory= /run/alarm-cd-pull/ (lock ephemere).
        # StateDirectory= /var/lib/alarm/cd/ (digests.tsv persistant).
        # Sans l'un OU l'autre, le script echoue avec "Permission denied".
        run: |
          sudo systemctl cat alarm-cd-pull.service | grep -E '^RuntimeDirectory=' || {
            echo "::error::RuntimeDirectory= absent de l'unit installee"
            exit 1
          }
          sudo systemctl cat alarm-cd-pull.service | grep -E '^StateDirectory=' || {
            echo "::error::StateDirectory= absent de l'unit installee"
            exit 1
          }

      - name: Verif StateDirectory cree avec ownership alarm
        # StateDirectory=alarm/cd cree /var/lib/alarm/cd/ owned alarm:alarm.
        # Persistent par defaut (contrairement a RuntimeDirectory), donc apres
        # le `systemctl start` le dossier doit exister meme si le service a
        # deja termine.
        run: |
          ls -la /var/lib/alarm/ /var/lib/alarm/cd/
          owner=$(stat -c '%U' /var/lib/alarm/cd)
          test "$owner" = "alarm" || {
            echo "::error::/var/lib/alarm/cd not owned by alarm (owner=$owner)"
            exit 1
          }

      - name: Regression — pas de duplication des logs dans le journal
        # Bug observe sur NODE3 le 2026-05-12 : chaque ligne `[alarm-cd-pull] ...`
        # apparaissait 2 fois dans `journalctl -u alarm-cd-pull` parce que log()
        # ecrivait sur stderr (-> StandardError=journal capture) ET appelait
        # `logger -t alarm-cd-pull` (-> syslog -> journal avec le meme tag).
        # Le smoke logue au moins 2 lignes WARN (1 par image, registry inaccessible
        # car pas d'auth GHCR sur le runner). Si une meme ligne apparait > 1 fois,
        # la duplication est revenue.
        run: |
          sudo journalctl -u alarm-cd-pull.service --no-pager --output=cat \
            | grep '^\[alarm-cd-pull\]' \
            | sort | uniq -c | sort -rn > /tmp/log-counts.txt
          echo "Compte par ligne (avant pipe : count, apres : message) :"
          cat /tmp/log-counts.txt
          max_count=$(awk 'NR==1 {print $1}' /tmp/log-counts.txt)
          if [[ -z "${max_count:-}" ]]; then
            echo "::warning::Aucune ligne [alarm-cd-pull] dans le journal (anormal en smoke)"
          elif [[ "$max_count" -gt 1 ]]; then
            echo "::error::Duplication regression : une ligne apparait $max_count fois"
            exit 1
          fi

      - name: Regression — get_local_digest tolere image absente (set -euo pipefail)
        # Bug observe en prod NODE3 le 2026-05-12 : si :stable existe distant
        # mais pas en cache local (cas du premier pull jamais sur un noeud),
        # le script alarm-cd-pull exit 1 silencieux sur la pipe
        # `docker image inspect ... | sed`, parce que :
        #   - docker image inspect retourne rc=1 quand l'image n'existe pas localement
        #   - set -o pipefail propage ce rc=1 sur la pipe entiere
        #   - set -e tue le shell immediatement, AVANT meme le premier log()
        # Fix : `|| echo ""` a la fin de la fonction (symetrique a get_remote_digest).
        # Test : extraire la fonction du script et l'appeler sur une image fictive,
        # doit renvoyer chaine vide sans crash.
        run: |
          set -euo pipefail
          REGISTRY=ghcr.io/claude-murgat
          TAG=does-not-exist-anywhere
          # Sourcer juste la def de get_local_digest (entre 'get_local_digest()' et le '}' de fin).
          eval "$(awk '/^get_local_digest\(\)/,/^}$/' /usr/local/bin/alarm-cd-pull)"
          result=$(get_local_digest some-image-that-does-not-exist)
          if [[ -n "$result" ]]; then
            echo "::error::get_local_digest devrait renvoyer chaine vide, a renvoye : '$result'"
            exit 1
          fi
          echo "OK : get_local_digest tolere image absente"

      - name: Resume CI
        if: always()
        run: |
          {
            echo "### Smoke install alarm-cd-pull"
            echo ""
            echo "Verifie : install OK, syntaxe systemd OK, pas de Permission denied,"
            echo "RuntimeDirectory= present."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-install-orchestrate:
    name: alarm-cd-orchestrate install smoke (V1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup user alarm (simulant NODE3 cloud)
        run: |
          sudo useradd -r -m -s /bin/bash alarm
          sudo usermod -aG docker alarm

      - name: Install script + units systemd
        # On installe AUSSI alarm-cd-canary.sh + alarm-cd-rollback.sh dans le
        # meme dossier que l'orchestrateur. Le script alarm-cd-orchestrate.sh
        # resout `alarm-cd-canary.sh` via $SCRIPT_DIR (= meme dir) — c'est ce
        # qu'on teste implicitement ici.
        run: |
          sudo install -m 755 scripts/alarm-cd-orchestrate.sh /usr/local/bin/alarm-cd-orchestrate
          sudo install -m 755 scripts/alarm-cd-canary.sh      /usr/local/bin/alarm-cd-canary.sh
          sudo install -m 755 scripts/alarm-cd-rollback.sh    /usr/local/bin/alarm-cd-rollback.sh
          sudo install -m 644 infra/onsite/systemd/alarm-cd-orchestrate.service /etc/systemd/system/
          sudo install -m 644 infra/onsite/systemd/alarm-cd-orchestrate.timer   /etc/systemd/system/
          sudo systemctl daemon-reload

      - name: Lint syntaxe unit systemd
        # systemd-analyze verify : refuse les directives inconnues, typos, etc.
        run: |
          sudo systemd-analyze verify \
            /etc/systemd/system/alarm-cd-orchestrate.service \
            /etc/systemd/system/alarm-cd-orchestrate.timer

      - name: Verif RuntimeDirectory + StateDirectory + EnvironmentFile presents
        # RuntimeDirectory= /run/alarm-cd-orchestrate/ (lock ephemere).
        # StateDirectory= /var/lib/alarm/cd/ (orchestrate.state persistant,
        # partage avec alarm-cd-pull).
        # EnvironmentFile= optionnel pour GATEWAY_KEY (cf §4 doc).
        run: |
          for directive in 'RuntimeDirectory=' 'StateDirectory=' 'EnvironmentFile='; do
            sudo systemctl cat alarm-cd-orchestrate.service | grep -E "^${directive}" || {
              echo "::error::${directive} absent de l'unit installee"
              exit 1
            }
          done

      - name: Timer livre disable par defaut (V1.5 opt-in)
        # Decision design (cf §4 V1.5) : le timer est livre dans le repo MAIS
        # n'est pas active par l'install standard. L'operateur l'active
        # explicitement apres avoir valide 5 cycles canary manuels. On verifie
        # ici qu'un `daemon-reload` seul ne l'active pas.
        run: |
          state=$(sudo systemctl is-enabled alarm-cd-orchestrate.timer 2>&1 || true)
          echo "state initial : $state"
          if [[ "$state" == "enabled" ]]; then
            echo "::error::alarm-cd-orchestrate.timer est enable des l'install — devrait etre disable par defaut (V1.5 opt-in)"
            exit 1
          fi

      - name: Lancer le service (Type=oneshot blocking)
        # Sans /etc/alarm/cd.env et sans image GHCR en cache, le script doit :
        #   1. Acquerir le lock (pas de Permission denied sur /run)
        #   2. Detecter qu'il n'y a pas d'image :stable cachee
        #   3. Log "Pas d'image ... Skip" + exit 0 propre
        # On tolere un exit non-0 (cas ou Docker n'est pas dispo sur le runner),
        # mais on echoue si "Permission denied" apparait.
        run: |
          sudo systemctl start alarm-cd-orchestrate.service || true
          sudo systemctl status alarm-cd-orchestrate.service --no-pager --lines=30 || true

      - name: Regression guard — pas de "Permission denied" dans le journal
        # Bug-archetype : symetrique a alarm-cd-pull. Si quelqu'un oublie
        # RuntimeDirectory= ou StateDirectory= dans le service, le script
        # crash sur "/run/alarm-cd-orchestrate/lock: Permission denied".
        run: |
          sudo journalctl -u alarm-cd-orchestrate.service --no-pager > /tmp/journal-orch.txt
          cat /tmp/journal-orch.txt
          if grep -qi "permission denied" /tmp/journal-orch.txt; then
            echo "::error::Regression: 'Permission denied' dans le journal alarm-cd-orchestrate"
            exit 1
          fi

      - name: Skip propre quand pas d'image :stable cachee
        # Sans image et sans GATEWAY_KEY, le script doit detecter le premier
        # blocage (pas d'image cachee) et exit 0 silencieusement (no-op). On
        # cherche la trace de "Pas d'image" qui prouve qu'on est passe par la
        # branche de skip et pas par un crash plus tot (avant le check d'image).
        run: |
          if ! grep -q "Pas d'image" /tmp/journal-orch.txt; then
            echo "::warning::Le script n'a pas atteint le check d'image cachee."
            echo "  Pas necessairement un bug — Docker peut ne pas etre dispo sur le runner."
            echo "  Mais a verifier si la regression revient."
            sudo journalctl -u alarm-cd-orchestrate.service --no-pager
          fi

      - name: Regression — pas de duplication des logs dans le journal
        # Symetrique a alarm-cd-pull. log() ecrit sur stderr seul -> 1 ligne
        # par message dans le journal. Si on retrouve `logger -t` ou autre
        # source de duplication, le compte par ligne sera > 1.
        run: |
          sudo journalctl -u alarm-cd-orchestrate.service --no-pager --output=cat \
            | grep '^\[alarm-cd-orchestrate\]' \
            | sort | uniq -c | sort -rn > /tmp/log-counts-orch.txt
          echo "Compte par ligne :"
          cat /tmp/log-counts-orch.txt
          max_count=$(awk 'NR==1 {print $1}' /tmp/log-counts-orch.txt)
          if [[ -n "${max_count:-}" && "$max_count" -gt 1 ]]; then
            echo "::error::Duplication regression : une ligne apparait $max_count fois"
            exit 1
          fi

      - name: Verif resolution alarm-cd-canary.sh via SCRIPT_DIR
        # L'orchestrateur resout alarm-cd-canary.sh via $SCRIPT_DIR (= meme
        # dossier). On verifie que les 3 scripts CD sont bien co-localises
        # apres install.
        run: |
          for s in alarm-cd-orchestrate alarm-cd-canary.sh alarm-cd-rollback.sh; do
            test -x "/usr/local/bin/$s" || {
              echo "::error::/usr/local/bin/$s manquant ou non executable"
              exit 1
            }
          done

      - name: Resume CI
        if: always()
        run: |
          {
            echo "### Smoke install alarm-cd-orchestrate (V1.5)"
            echo ""
            echo "Verifie : install OK, syntaxe systemd OK, pas de Permission denied,"
            echo "RuntimeDirectory= / StateDirectory= / EnvironmentFile= presents,"
            echo "timer livre disable par defaut (opt-in V1.5)."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-install-chaos:
    # INV-176..179 : runner de panne controlee (NODE3, a la main comme l'orchestrateur).
    name: alarm-chaos install smoke (panne controlee)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup user alarm (simulant NODE3 cloud)
        run: |
          sudo useradd -r -m -s /bin/bash alarm
          sudo usermod -aG docker alarm

      - name: Install script + units systemd (procedure docs/CD_DESIGN.md §9ter)
        run: |
          sudo install -m 755 scripts/alarm-chaos.sh /usr/local/bin/alarm-chaos
          sudo install -m 644 infra/onsite/systemd/alarm-chaos.service /etc/systemd/system/
          sudo install -m 644 infra/onsite/systemd/alarm-chaos.timer   /etc/systemd/system/
          sudo systemctl daemon-reload

      - name: Lint syntaxe unit systemd + bash
        run: |
          sudo systemd-analyze verify /etc/systemd/system/alarm-chaos.service /etc/systemd/system/alarm-chaos.timer
          bash -n scripts/alarm-chaos.sh

      - name: Verif StateDirectory + EnvironmentFile presents
        # StateDirectory=alarm/cd : verrou orchestrate.lock partage avec l'orchestrateur.
        run: |
          for directive in 'StateDirectory=' 'EnvironmentFile=' 'User=alarm'; do
            sudo systemctl cat alarm-chaos.service | grep -E "^${directive}" || {
              echo "::error::${directive} absent de l'unit installee"
              exit 1
            }
          done

      - name: Timer livre disable par defaut (opt-in operateur)
        run: |
          state=$(sudo systemctl is-enabled alarm-chaos.timer 2>&1 || true)
          echo "state initial : $state"
          if [[ "$state" == "enabled" ]]; then
            echo "::error::alarm-chaos.timer est enable des l'install — devrait etre disable par defaut"
            exit 1
          fi

      - name: Lancer le service (sans cd.env -> exit 1 propre « GATEWAY_KEY non definie »)
        run: |
          sudo systemctl start alarm-chaos.service || true
          sudo journalctl -u alarm-chaos.service --no-pager > /tmp/journal-chaos.txt
          cat /tmp/journal-chaos.txt
          grep -q "GATEWAY_KEY non definie" /tmp/journal-chaos.txt || {
            echo "::error::le script n'a pas atteint le controle GATEWAY_KEY"
            exit 1
          }
          if grep -qi "permission denied" /tmp/journal-chaos.txt; then
            echo "::error::Regression: 'Permission denied' dans le journal alarm-chaos"
            exit 1
          fi

      - name: "Verrou partage : avec cd.env, le runner prend STATE_DIR/orchestrate.lock puis sort proprement"
        # Pas de leader joignable sur le runner CI -> « aucun leader joignable », exit 0.
        run: |
          sudo install -d -m 750 -o root -g alarm /etc/alarm
          echo "GATEWAY_KEY=smoke" | sudo tee /etc/alarm/cd.env >/dev/null
          sudo chmod 640 /etc/alarm/cd.env && sudo chown root:alarm /etc/alarm/cd.env
          sudo systemctl start alarm-chaos.service
          test -f /var/lib/alarm/cd/orchestrate.lock
          test "$(stat -c '%U' /var/lib/alarm/cd/orchestrate.lock)" = alarm
          sudo journalctl -u alarm-chaos.service --no-pager | grep -q "aucun leader joignable"

  gateway-sync:
    # Issue #183 : deploiement auto du code gateway. Bout en bout sur une vraie
    # gateway simulee (unit systemd factice qui n'annonce "Gateway operationnelle"
    # que si le code n'est pas marque BROKEN).
    name: alarm-gateway-sync (deploiement auto gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMG: ghcr.io/claude-murgat/alarm-gateway:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install script + units, image :stable locale
        run: |
          sudo install -m 755 scripts/alarm-gateway-sync.sh /usr/local/bin/alarm-gateway-sync
          sudo install -m 644 infra/onsite/systemd/alarm-gateway-sync.service /etc/systemd/system/
          sudo install -m 644 infra/onsite/systemd/alarm-gateway-sync.timer /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemd-analyze verify /etc/systemd/system/alarm-gateway-sync.service /etc/systemd/system/alarm-gateway-sync.timer
          docker build -t "$IMG" gateway/

      - name: Noeud sans gateway -> ne fait rien
        run: |
          sudo systemctl start alarm-gateway-sync.service
          test ! -f /var/lib/alarm/cd/gateway-image-id

      - name: Simuler une gateway installee (ancien code)
        run: |
          sudo useradd --system alarm-gateway
          sudo install -d -o alarm-gateway -g alarm-gateway -m 750 /opt/alarm-gateway
          echo "# ancien code" | sudo tee /opt/alarm-gateway/modem_gateway.py >/dev/null
          sudo tee /etc/systemd/system/alarm-sms-gateway.service >/dev/null <<'UNIT'
          [Service]
          ExecStart=/bin/sh -c 'grep -q BROKEN /opt/alarm-gateway/modem_gateway.py || echo "Gateway operationnelle"; exec sleep infinity'
          UNIT
          # requirements deja installes : on teste le deploiement, pas pip.
          sudo install -D -m 644 gateway/requirements.txt /var/lib/alarm/cd/gateway-requirements.txt
          sudo systemctl daemon-reload
          sudo systemctl start alarm-sms-gateway.service

      - name: Nouveau code -> installe, proprietaire conserve, gateway relancee
        run: |
          sudo systemctl start alarm-gateway-sync.service
          for f in gateway/*.py; do sudo cmp "$f" "/opt/alarm-gateway/$(basename "$f")"; done
          for f in gateway/voice/*.wav; do sudo cmp "$f" "/opt/alarm-gateway/voice/$(basename "$f")"; done
          test "$(sudo stat -c %U /opt/alarm-gateway/modem_gateway.py)" = alarm-gateway
          test "$(sudo stat -c %U /opt/alarm-gateway/voice/alarme.wav)" = alarm-gateway
          test "$(sudo cat /var/lib/alarm/cd/gateway-image-id)" = "$(docker image inspect "$IMG" -f '{{.Id}}')"
          sudo grep -q "ancien code" /var/lib/alarm/cd/gateway-prev/modem_gateway.py
          systemctl is-active alarm-sms-gateway.service

      - name: Idempotent -> pas de 2e redemarrage
        run: |
          BEFORE=$(systemctl show alarm-sms-gateway -p ExecMainPID --value)
          sudo systemctl start alarm-gateway-sync.service
          test "$BEFORE" = "$(systemctl show alarm-sms-gateway -p ExecMainPID --value)"

      - name: Code casse -> rollback vers l'ancien code, pas de boucle
        run: |
          BAD=$(mktemp -d); cp -r gateway/. "$BAD/"
          echo "# BROKEN" >> "$BAD/modem_gateway.py"
          docker build -t "$IMG" -f gateway/Dockerfile "$BAD"
          sudo env HEALTH_TIMEOUT=15 /usr/local/bin/alarm-gateway-sync
          sudo cmp gateway/modem_gateway.py /opt/alarm-gateway/modem_gateway.py
          test "$(sudo cat /var/lib/alarm/cd/gateway-image-id)" = "$(docker image inspect "$IMG" -f '{{.Id}}')"
          systemctl is-active alarm-sms-gateway.service
          sudo journalctl -u alarm-gateway-sync --no-pager | tail -5 || true
