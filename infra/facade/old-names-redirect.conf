# VPS façade : anciens noms, un par nœud (onsite-1 / onsite-2), redirigés depuis le 2026-11-24 (INV-199).
# Extrait de référence : dans le vhost :443 existant de chaque ancien nom (fichier -le-ssl de certbot), la ligne
# Redirect remplace l'ancien ProxyPass vers 10.200.0.5 / .6. Le chemin est conservé (/api/x → https://alarme…/api/x).
# Retrouver les fichiers : grep -l 'alarme[12].izeron' /etc/apache2/sites-enabled/*

# vhost :443 ServerName alarme1.izeron.charlesmurgat.com
    Redirect permanent / https://alarme.charlesmurgat.com/

# vhost :443 ServerName alarme2.izeron.charlesmurgat.com
    Redirect permanent / https://alarme.charlesmurgat.com/
