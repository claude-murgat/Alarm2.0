# VPS façade : /etc/apache2/sites-available/alarme.charlesmurgat.com.conf (a2ensite) — copie de référence (INV-199).
# :80. Le bloc Rewrite a été ajouté par certbot (--apache) : tout part en 301 vers https.
<VirtualHost *:80>
    ServerName alarme.charlesmurgat.com
    ProxyPreserveHost On
    ProxyPass / balancer://alarme/
    ProxyPassReverse / balancer://alarme/
RewriteEngine on
RewriteCond %{SERVER_NAME} =alarme.charlesmurgat.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
