# VPS façade 51.77.222.190 : /etc/apache2/conf-available/alarme-murgat-balancer.conf (a2enconf alarme-murgat-balancer)
# Copie de référence (INV-199, infra/facade/README.md) : la configuration en service est sur le VPS, posée à la main.
# Modules activés pour la façade : proxy_balancer lbmethod_byrequests slotmem_shm proxy_hcheck (requièrent proxy, proxy_http).
#
# Un membre par nœud : nœuds sur site par leur adresse wg1 (10.200.0.0/24 ; interface wg0 du VPS), NODE3 par son
# IP publique. Santé : GET /health toutes les 10 s, hors du pool après 2 échecs, de retour au 1er succès.
# upgrade=websocket : WebSocket /api/ws de l'UI (backend/app/templates/index.html).
<Proxy "balancer://alarme">
    BalancerMember "http://10.200.0.7:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    BalancerMember "http://10.200.0.8:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    BalancerMember "http://10.200.0.9:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    BalancerMember "http://10.200.0.10:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    # onsite-1 / onsite-2 : à retirer le jour du déménagement (README « Retirer un nœud »)
    BalancerMember "http://10.200.0.5:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    BalancerMember "http://10.200.0.6:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    # NODE3 (OVH), IP publique
    BalancerMember "http://51.210.105.102:8000" hcmethod=GET hcuri=/health hcinterval=10 hcpasses=1 hcfails=2 connectiontimeout=3 timeout=60 retry=30 upgrade=websocket
    ProxySet lbmethod=byrequests
</Proxy>
