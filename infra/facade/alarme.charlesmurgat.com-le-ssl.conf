# VPS façade : /etc/apache2/sites-available/alarme.charlesmurgat.com-le-ssl.conf — copie de référence (INV-199).
# :443, créé par certbot (snap, /snap/bin/certbot --apache) à partir du vhost :80. Certificat Let's Encrypt : chemins
# seulement, la clé privée reste sur le VPS.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName alarme.charlesmurgat.com
    ProxyPreserveHost On
    ProxyPass / balancer://alarme/
    ProxyPassReverse / balancer://alarme/
    ErrorLog ${APACHE_LOG_DIR}/alarme_error.log
    CustomLog ${APACHE_LOG_DIR}/alarme_access.log combined
SSLCertificateFile /etc/letsencrypt/live/alarme.charlesmurgat.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/alarme.charlesmurgat.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
